# The site is served from the gh-pages branch, which is a plain mirror of main.
# Keeping it in sync by hand is easy to forget, so every push to main is
# fast-forwarded onto gh-pages here.
name: Sync gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-sync by hand from the Actions tab

concurrency:
  group: sync-gh-pages      # never let two syncs race
  cancel-in-progress: false

permissions:
  contents: write           # needed to push to gh-pages

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # gh-pages must be reachable for the push to fast-forward

      - name: Fast-forward gh-pages to main
        run: |
          if git push origin HEAD:refs/heads/gh-pages; then
            echo "gh-pages is now at $(git rev-parse --short HEAD)"
          else
            echo "::error::gh-pages could not be fast-forwarded — it has commits that are not on main."
            echo "::error::Reconcile it by hand (merge them into main, or force-push gh-pages if they are disposable)."
            exit 1
          fi
